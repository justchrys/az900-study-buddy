<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--muted:#6b6a64;--card:#fff;--line:#e2e0d8;--accent:#0b6e4f;--accent-fg:#fff;--good:#0b6e4f;--bad:#b3261e;--goodbg:#e3f3ec;--badbg:#fbe9e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#efeee9;--muted:#9c9a92;--card:#1f1f1d;--line:#34332f;--accent:#4cc79a;--accent-fg:#0c1f17;--good:#4cc79a;--bad:#ff8a80;--goodbg:#14322a;--badbg:#3a1f1c}}
:root[data-theme="dark"]{--bg:#141413;--fg:#efeee9;--muted:#9c9a92;--card:#1f1f1d;--line:#34332f;--accent:#4cc79a;--accent-fg:#0c1f17;--good:#4cc79a;--bad:#ff8a80;--goodbg:#14322a;--badbg:#3a1f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 16px}
nav{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:inherit;color:var(--muted);cursor:pointer}
nav button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
label{font-size:.85rem;color:var(--muted);display:block;margin:0 0 4px}
select,input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row>*{flex:1;min-width:150px}
button.pri{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.pri:disabled{opacity:.5;cursor:wait}
button.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:4px 12px;font-size:.85rem;cursor:pointer}
.msg{white-space:pre-wrap;margin:0 0 12px}
.msg.me{color:var(--muted);font-size:.9rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.big{font-size:2.4rem;font-weight:700;line-height:1}
.muted{color:var(--muted);font-size:.85rem}
.err{color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<p class="sub">Unofficial study aid. Not affiliated with or endorsed by Microsoft. Original practice content; always verify on Microsoft Learn.</p>

</section>
</main>

<script>
const D={
  cloud:{name:"Describe cloud concepts",w:.275,subs:["Cloud computing benefits (high availability, scalability, elasticity, agility)","Shared responsibility model","CapEx vs OpEx and consumption-based pricing","IaaS, PaaS and SaaS","Public, private and hybrid cloud","Reliability, predictability, security and governance in the cloud"]},
  arch:{name:"Describe Azure architecture and services",w:.375,subs:["Regions, region pairs and availability zones","Resource groups and subscriptions","Virtual machines, scale sets and availability sets","Containers, App Service and Azure Functions","Virtual networks, VPN Gateway and ExpressRoute","Storage accounts, redundancy and tiers","Microsoft Entra ID, SSO, MFA and Conditional Access","Zero Trust and defence in depth","Azure IoT, AI and serverless service categories"]},
  mgmt:{name:"Describe Azure management and governance",w:.35,subs:["Cost factors and the pricing calculator / TCO calculator","Microsoft Cost Management and tags","Azure Policy and resource locks","Microsoft Purview and compliance","Azure portal, Cloud Shell, CLI and PowerShell","Azure Resource Manager, ARM templates and Bicep","Azure Arc and infrastructure as code","Azure Advisor, Service Health and Azure Monitor"]}
};
const $=s=>document.querySelector(s);
const KEY="az900-unofficial-stats-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let stats=load(), recent=[];

// ---- built-in content (no AI or backend needed)
const BUD=[
{k:/lock/i,t:"A resource lock stops accidental deletion or changes. A delete lock lets people read and edit a resource but not delete it; a read-only lock blocks edits too. Locks apply even to owners until someone removes them.\n\nExample: a padlock on the shop safe. Even the manager has to take the lock off first.\n\nExam tip: locks protect against accidents, while Azure Policy enforces rules about how resources are set up."},
{k:/region|pair/i,t:"An Azure region is a geographic area with one or more datacenters. Most regions are paired with another region in the same geography. In a wide outage Azure prioritises recovering one region of each pair, and geo-redundant storage copies data to the paired region.\n\nExample: two branches of a bank in different cities, so a problem in one city doesn’t stop the whole bank.\n\nExam tip: availability zones protect inside a region, region pairs protect across regions."},
{k:/cost|pricing|tco|budget|\btags?\b/i,t:"The pricing calculator estimates what planned Azure services will cost. The TCO calculator compares running on-premises with running in Azure. Microsoft Cost Management tracks your actual spending, and budgets can alert you. Tags label resources so you can group costs, for example by department.\n\nExample: estimating a wedding budget before booking, then tracking receipts afterwards.\n\nExam tip: pricing = future Azure cost, TCO = on-premises versus Azure, Cost Management = what you are spending now."},
{k:/entra|identity|\bsso\b|\bmfa\b|multifactor|active directory/i,t:"Microsoft Entra ID is Azure’s cloud identity service. It handles sign-in, single sign-on (one sign-in for many apps) and multifactor authentication (extra proof such as a code on your phone). Conditional Access decides when to allow, block or challenge a sign-in.\n\nExample: one ID card that opens the office gate, the library and the lab, with a second check for the server room.\n\nExam tip: authentication is who you are, authorisation is what you are allowed to do."},
{k:/zero trust|defen[cs]e/i,t:"Zero Trust means never trusting a request by default: verify explicitly, use least-privilege access and assume a breach. Defence in depth means several layers of protection, so if one fails the next still stands.\n\nExample: a compound with a gate, a guard, a locked door and a locked cupboard.\n\nExam tip: Zero Trust is the mindset, defence in depth is the layered design."},
{k:/vnet|virtual network|vpn|expressroute/i,t:"An Azure virtual network is your own private network in the cloud. A VPN Gateway connects it to your office over the internet using encryption. ExpressRoute gives a private dedicated connection that does not use the public internet.\n\nExample: sending goods in a locked truck on the public road (VPN) versus building your own private road (ExpressRoute).\n\nExam tip: a private connection that avoids the internet means ExpressRoute."},
{k:/storage|blob|redundan|\b[lgz]rs\b/i,t:"A storage account holds blobs (files and media), file shares, queues and tables. Redundancy options copy your data: LRS keeps copies in one datacenter, ZRS spreads them across availability zones, and GRS also copies to a second region. Access tiers such as hot, cool, cold and archive trade cost against how often you read the data.\n\nExample: keeping photos in a drawer at home, a cupboard, or a store in another town.\n\nExam tip: more distance between copies means more protection and usually more cost."},
{k:/\barm\b|bicep|template|\biac\b|infrastructure as code/i,t:"Azure Resource Manager (ARM) is the layer that deploys and manages Azure resources. ARM templates and Bicep describe the resources you want in a file, so deployments are repeatable. Bicep is a simpler language that is turned into an ARM template.\n\nExample: following a written recipe instead of cooking from memory each time.\n\nExam tip: declare it in a file and deploy it the same way every time: infrastructure as code."},
{k:/monitor|advisor|service health/i,t:"Azure Monitor collects and analyses data about your resources. Azure Advisor gives personalised recommendations on cost, security, reliability and performance. Azure Service Health tells you about Azure issues and planned maintenance that affect you.\n\nExample: a dashboard of your shop’s sales (Monitor), a consultant’s tips (Advisor), and a notice from the landlord about repairs (Service Health).\n\nExam tip: Monitor = what is happening, Advisor = what to improve, Service Health = Azure’s own problems."},
{k:/compute|\bvms?\b|virtual machine|container|app service|function|serverless|scale set/i,t:"Virtual machines give you full control of a server (IaaS). Containers package an app so it runs the same anywhere and are lighter than VMs. Azure App Service hosts web apps without server management (PaaS). Azure Functions runs code only when triggered and bills per execution (serverless).\n\nExample: renting a whole shop (VM), a stall in a market (container), a furnished shop (App Service), or hiring a rider only when an order arrives (Functions).\n\nExam tip: the less you manage, the more managed the service."},
{k:/elastic|scalab/i,t:"Scalability is growing capacity to meet long-term growth. Elasticity is automatically adding and removing resources as demand rises and falls.\n\nExample: buying a second boda boda because your regular customers doubled over the year is scalability. Calling in three extra riders for one chaotic Friday at 5pm, then sending them home, is elasticity.\n\nExam tip: if the question mentions automatically shrinking back after a spike, the answer is elasticity."},
{k:/zone|availab/i,t:"An availability zone is one or more separate datacenters inside an Azure region, each with its own power, cooling and networking.\n\nExample: think of three markets in one city on different power lines. If one has a blackout, the others keep trading.\n\nExam tip: zones protect against a datacenter failure inside a region. Region pairs are about disasters that hit a whole region."},
{k:/shared|responsib/i,t:"In the shared responsibility model, Microsoft secures the physical datacenter and you stay responsible for your data, accounts and devices. Everything in between shifts depending on IaaS, PaaS or SaaS.\n\nExample: a landlord looks after the building, but you still lock your own door and decide who gets a key.\n\nExam tip: your data and identities are your responsibility in every model."},
{k:/iaas|paas|saas/i,t:"IaaS gives you raw infrastructure (virtual machines) to manage yourself. PaaS gives you a platform where you only manage your app and data. SaaS is finished software you simply use.\n\nExample: IaaS is renting an empty plot and building a shop. PaaS is renting a furnished shop and bringing your stock. SaaS is buying lunch at a restaurant.\n\nExam tip: more control means IaaS, less management means SaaS."},
{k:/policy/i,t:"Azure Policy checks that your resources follow your rules, for example only allowing certain regions or requiring tags. It can also flag or block non-compliant resources.\n\nExample: a company rule that every shop must display a licence. Policy is the inspector checking each one.\n\nExam tip: Policy is about rules on resources, role-based access control is about who can act, and locks stop deletion or changes."},
{k:/capex|opex|expend/i,t:"CapEx is paying a large amount upfront for assets. OpEx is paying as you go for what you use. Cloud is mostly OpEx with consumption-based pricing.\n\nExample: buying your own motorbike is CapEx. Paying a boda boda per trip is OpEx.\n\nExam tip: pay-as-you-go and no upfront hardware means OpEx."}
];
const BANK=[
{d:"cloud",i:4,question:"A bank keeps customer records in its own datacenter but runs its public website in Azure, with the two connected. Which model is this?",options:["Public cloud","Private cloud","Hybrid cloud","Multicloud"],answer:2,why:"Hybrid cloud combines on-premises or private infrastructure with a public cloud.",whyNot:["Public cloud alone would put everything in Azure.","A private cloud alone would keep everything in the bank’s own environment.","Correct.","Multicloud means using more than one public cloud provider."],tip:"Own datacenter plus public cloud: hybrid."},
{d:"arch",i:0,question:"Which statement best describes an Azure region pair?",options:["Two regions in the same geography that help provide resilience against a regional disaster","Two availability zones inside the same datacenter","Two subscriptions linked for billing","Two virtual networks connected by peering"],answer:0,why:"Region pairs link two regions in the same geography so recovery and data copies can be handled across regions.",whyNot:["Correct.","Availability zones sit inside one region and are not a region pair.","Billing links between subscriptions have nothing to do with regions.","Peering connects virtual networks and is unrelated to region pairs."],tip:"Zones inside a region, pairs across regions."},
{d:"arch",i:2,question:"Which feature automatically adds or removes VM instances as demand changes?",options:["Virtual Machine Scale Sets","Availability sets","Resource groups","Azure Bastion"],answer:0,why:"Scale sets manage a group of identical VMs and can change the number of instances automatically.",whyNot:["Correct.","Availability sets spread VMs across hardware to reduce downtime and do not change the instance count.","Resource groups only organise resources.","Bastion provides secure remote access and does not scale VMs."],tip:"Auto-adding VMs: scale sets."},
{d:"arch",i:4,question:"Which service provides a private connection between an on-premises network and Azure that does not travel over the public internet?",options:["ExpressRoute","VPN Gateway","Azure Bastion","Azure Firewall"],answer:0,why:"ExpressRoute uses a private connection through a connectivity provider instead of the public internet.",whyNot:["Correct.","A VPN Gateway encrypts traffic but sends it over the public internet.","Bastion gives secure remote access to VMs.","Azure Firewall filters network traffic and does not connect networks."],tip:"Private line, not the internet: ExpressRoute."},
{d:"arch",i:7,question:"Which security principle says to verify every request explicitly, as though it came from an open network?",options:["Zero Trust","Perimeter security","Shared responsibility","Security by obscurity"],answer:0,why:"Zero Trust assumes no request is trusted by default and verifies each one.",whyNot:["Correct.","Perimeter security trusts anything already inside the network boundary.","Shared responsibility describes who secures what in the cloud.","Hiding details is not a verification model."],tip:"Never trust, always verify."},
{d:"mgmt",i:3,question:"Which service helps you govern and understand data across on-premises, multicloud and SaaS sources?",options:["Microsoft Purview","Azure Monitor","Azure Bastion","Azure DevOps"],answer:0,why:"Microsoft Purview provides data governance, risk and compliance across your data estate.",whyNot:["Correct.","Monitor collects telemetry about resources and apps.","Bastion provides secure remote access to VMs.","Azure DevOps supports software development workflows."],tip:"Data governance and compliance: Purview."},
{d:"mgmt",i:4,question:"Which tool lets you run Azure CLI or PowerShell commands from a browser without installing anything locally?",options:["Azure Cloud Shell","Azure Advisor","Azure Arc","Azure Policy"],answer:0,why:"Cloud Shell is a browser-based command line with Azure CLI and PowerShell ready to use.",whyNot:["Correct.","Advisor gives recommendations and has no command line.","Arc extends Azure management to resources outside Azure.","Policy enforces rules on resources."],tip:"Command line in the browser: Cloud Shell."},
{d:"mgmt",i:5,question:"Which approach lets you describe Azure resources in a file so deployments are repeatable and consistent?",options:["Infrastructure as code with ARM templates or Bicep","Clicking through the portal each time","Azure Advisor recommendations","Resource locks"],answer:0,why:"ARM templates and Bicep declare resources in code, so the same deployment can be repeated.",whyNot:["Correct.","Manual clicking is slow and hard to repeat exactly.","Advisor gives advice and does not deploy resources.","Locks prevent changes and do not define resources."],tip:"Same file, same result."},
{d:"mgmt",i:6,question:"Which service lets you manage servers running on-premises or in other clouds from Azure?",options:["Azure Arc","Azure Advisor","Azure Service Health","Azure Cloud Shell"],answer:0,why:"Azure Arc extends Azure management and governance to resources outside Azure.",whyNot:["Correct.","Advisor recommends improvements for Azure resources.","Service Health reports on Azure service issues.","Cloud Shell is a browser command line, not a management extension."],tip:"Arc reaches outside Azure."},
{d:"cloud",i:0,question:"A retailer’s site gets ten times its normal traffic for one day and then returns to normal. Which capability lets resources grow for the spike and shrink afterward automatically?",options:["Elasticity","High availability","Disaster recovery","Fault tolerance"],answer:0,why:"Elasticity is automatically adding and removing resources to match demand, including shrinking when the spike ends.",whyNot:["Correct.","High availability is about keeping a service running with minimal downtime, not matching demand.","Disaster recovery is about recovering after a major failure.","Fault tolerance is about continuing to work when a component fails."],tip:"Spike up, then back down by itself: elasticity."},
{d:"cloud",i:1,question:"When a company uses a SaaS product such as an online email service, which item always remains the customer’s responsibility?",options:["Physical datacenter security","Operating system patching","The information and data, and who has access to it","Network cabling"],answer:2,why:"In every cloud service model the customer remains responsible for their data, accounts and access.",whyNot:["The provider secures the physical datacenter in every model.","In SaaS the provider manages the operating system.","Correct.","Cabling is part of the provider’s physical infrastructure."],tip:"Data and identities are always yours."},
{d:"cloud",i:2,question:"A startup avoids buying servers and pays only for the compute hours it uses each month. Which describes this approach?",options:["Capital expenditure (CapEx)","Operational expenditure (OpEx) with consumption-based pricing","A perpetual software licence","A private cloud"],answer:1,why:"Paying for what you use as you go is operational expenditure, which is how consumption-based cloud pricing works.",whyNot:["CapEx means a large upfront purchase of assets such as servers.","Correct.","A perpetual licence is a one-time purchase, the opposite of pay-as-you-go.","A private cloud is a deployment model and says nothing about how you pay."],tip:"Pay as you go means OpEx."},
{d:"cloud",i:3,question:"A team has written its own web app and wants to deploy it without managing the operating system or servers. Which service model fits best?",options:["IaaS","PaaS","SaaS","Private cloud"],answer:1,why:"With PaaS the provider manages the operating system and infrastructure while you manage your application and data.",whyNot:["With IaaS you still manage the operating system.","Correct.","SaaS is finished software you use, not a place to deploy your own code.","A private cloud is a deployment model, not a service model."],tip:"Your own code, no server management: PaaS."},
{d:"arch",i:0,question:"You want a VM-based workload to survive the failure of a single datacenter inside one Azure region. What should you use?",options:["Availability Zones","Resource groups","Management groups","Azure Policy"],answer:0,why:"Availability Zones are physically separate locations inside a region with independent power, cooling and networking.",whyNot:["Correct.","Resource groups organise resources and add no resilience.","Management groups organise subscriptions and add no resilience.","Policy enforces rules and does not protect against failures."],tip:"Zones guard against datacenter failure, region pairs against regional disaster."},
{d:"arch",i:1,question:"Which statement about Azure resource groups is true?",options:["Every resource belongs to exactly one resource group","A resource can belong to several resource groups at once","A resource group cannot be deleted once created","Resource groups are billed separately from their resources"],answer:0,why:"Each resource lives in exactly one resource group, and deleting the group deletes the resources inside it.",whyNot:["Correct.","A resource has one resource group at a time, though it can be moved.","Resource groups can be deleted, which also deletes their resources.","You pay for the resources, not for the group itself."],tip:"One resource, one group."},
{d:"arch",i:3,question:"You need code that runs only when an event triggers it and is billed per execution. Which Azure service fits best?",options:["Azure Functions","Azure Virtual Machines","Azure Virtual Network","Azure Bastion"],answer:0,why:"Azure Functions is serverless: your code runs on a trigger and you pay for execution rather than for idle servers.",whyNot:["Correct.","VMs run and bill continuously and you manage them.","A virtual network provides connectivity, not code execution.","Bastion gives secure remote access to VMs, not event-driven code."],tip:"Event trigger plus pay per run: Functions."},
{d:"arch",i:5,question:"You need to store large amounts of unstructured data such as images and videos. Which Azure storage service fits best?",options:["Azure Blob Storage","Azure Files","Azure Queue Storage","Azure Table Storage"],answer:0,why:"Blob Storage is built for large amounts of unstructured data such as images, video and backups.",whyNot:["Correct.","Azure Files provides managed file shares, mainly for shared file access.","Queue Storage passes messages between components.","Table Storage holds structured NoSQL key-value data."],tip:"Unstructured at scale: Blob."},
{d:"arch",i:6,question:"A user signs in once and can then reach several applications without signing in again. Which capability provides this?",options:["Single sign-on (SSO)","Multifactor authentication","Conditional Access","Role-based access control"],answer:0,why:"Single sign-on lets one sign-in grant access to multiple applications.",whyNot:["Correct.","MFA requires extra proof of identity at sign-in; it is not about signing in once.","Conditional Access decides whether to allow, block or challenge sign-ins based on conditions.","Role-based access control manages what an identity can do with Azure resources."],tip:"Sign in once, reach many apps: SSO."},
{d:"mgmt",i:0,question:"Which tool estimates the monthly cost of Azure services you plan to deploy?",options:["Pricing calculator","TCO calculator","Azure Advisor","Azure Service Health"],answer:0,why:"The pricing calculator estimates the cost of the specific Azure services and configurations you choose.",whyNot:["Correct.","The TCO calculator compares running on-premises with running in Azure.","Advisor gives optimisation recommendations for resources you already run.","Service Health reports on Azure service issues that affect you."],tip:"Pricing = what will Azure cost; TCO = Azure versus on-premises."},
{d:"mgmt",i:1,question:"Which feature lets you label resources by department so you can later view costs per department?",options:["Tags","Resource locks","Azure Policy","Availability sets"],answer:0,why:"Tags are name-value labels on resources that you can use to group and filter costs.",whyNot:["Correct.","Locks stop deletion or changes and do not label resources.","Policy enforces rules, though it can require tags to exist.","Availability sets spread VMs across hardware for resilience."],tip:"Label it with a tag to report on it."},
{d:"mgmt",i:2,question:"You want to prevent anyone, even an owner, from accidentally deleting a production database. What should you apply?",options:["A resource lock","An Azure Policy","A tag","A budget alert"],answer:0,why:"A resource lock set to prevent deletion blocks deletes regardless of the user’s permissions until the lock is removed.",whyNot:["Correct.","Policy enforces rules on how resources are configured and does not block a delete in this way.","Tags are labels and protect nothing.","A budget alert notifies you about spending, not deletions."],tip:"Stop accidental delete: lock."},
{d:"mgmt",i:7,question:"Which service gives personalised recommendations to improve the reliability, security, performance and cost of your Azure resources?",options:["Azure Advisor","Azure Service Health","Azure Monitor","Azure Arc"],answer:0,why:"Azure Advisor analyses your resources and recommends improvements across several areas, including cost, security and reliability.",whyNot:["Correct.","Service Health tells you about Azure service incidents and planned maintenance.","Monitor collects and analyses telemetry and does not give optimisation advice.","Arc extends Azure management to resources outside Azure."],tip:"Advisor = advice."}
];
function offlineAsk(q){
  const me=document.createElement("p");me.className="msg me";me.textContent="You: "+q;
  const out=document.createElement("p");out.className="msg";
  const hit=BUD.find(b=>b.k.test(q));
  out.textContent=hit?hit.t:"I don’t have a built-in explanation for that yet. Try one of the topic buttons above, or look it up on Microsoft Learn.";
  $("#chat").prepend(out);$("#chat").prepend(me);
}
function offlineQ(forceSub){
  const dom=$("#dom").value;
  let pool=BANK.filter(b=>b.d===dom);
  if(forceSub){const m=pool.filter(b=>D[b.d].subs[b.i]===forceSub);if(m.length)pool=m}
  const fresh=pool.filter(b=>!recent.includes(b.question.slice(0,80)));
  const src=fresh.length?fresh:pool;
  const r=src[Math.floor(Math.random()*src.length)];
  recent.push(r.question.slice(0,80));
  const box=$("#qbox");box.innerHTML="";
  const card=document.createElement("div");card.className="card";box.appendChild(card);
  const o=[0,1,2,3].sort(()=>Math.random()-.5);
  const q={...r,options:o.map(i=>r.options[i]),whyNot:o.map(i=>r.whyNot[i]),answer:o.indexOf(r.answer)};
  show(card,q,r.d,D[r.d].subs[r.i]);
}

  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));

  if(b.dataset.t==="progress")renderProgress();
});

const CHIPS=["Scalability vs elasticity","Availability zones","Regions and region pairs","Shared responsibility","IaaS, PaaS, SaaS","CapEx vs OpEx","Compute options","Virtual networks","Storage and redundancy","Microsoft Entra ID","Zero Trust","Azure Policy","Resource locks","Cost management","ARM and Bicep","Monitor and Advisor"];
CHIPS.forEach(t=>{const c=document.createElement("button");c.className="chip";c.textContent=t;c.onclick=()=>{$("#q").value=t;ask()};$("#chips").appendChild(c)});
$("#ask").onclick=ask;
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});

// ---- Quiz
Object.entries(D).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v.name;$("#dom").appendChild(o)});
function pickSub(dom,weak){
  const subs=D[dom].subs;
  if(weak){const t=subs.filter(s=>stats[s]).sort((a,b)=>acc(a)-acc(b));if(t.length&&acc(t[0])<.8)return t[0]}
  return subs[Math.floor(Math.random()*subs.length)];
}
const acc=s=>stats[s]?stats[s].c/stats[s].a:0;
$("#gen").onclick=()=>newQ(false);
$("#weak").onclick=()=>{
  let best=null,bs=2;
  Object.entries(D).forEach(([k,v])=>v.subs.forEach(s=>{if(stats[s]&&acc(s)<bs){bs=acc(s);best=[k,s]}}));
  if(best){$("#dom").value=best[0];newQ(true,best[1])}else newQ(false);
};
function newQ(weak,forceSub){offlineQ(forceSub)}
function show(card,r,dom,sub){
  card.textContent="";
  const m=document.createElement("div");m.className="muted";m.textContent=D[dom].name+" · "+sub;card.appendChild(m);
  const q=document.createElement("p");q.style.fontWeight="600";q.textContent=r.question;card.appendChild(q);
  let done=false;
  r.options.forEach((t,i)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+i)+". "+t;
    b.onclick=()=>{
      if(done)return;done=true;
      const ok=i===r.answer;
      const s=stats[sub]||(stats[sub]={d:dom,a:0,c:0});s.a++;if(ok)s.c++;save(stats);
      [...card.querySelectorAll(".opt")].forEach((x,j)=>{if(j===r.answer)x.classList.add("good");else if(j===i)x.classList.add("bad")});
      const fb=document.createElement("div");fb.className="fb";
      const why=Array.isArray(r.whyNot)&&r.whyNot[i]&&!ok?"\n\nYour choice: "+r.whyNot[i]:"";
      fb.textContent=(ok?"Correct! ":"Not quite. The answer is "+String.fromCharCode(65+r.answer)+". ")+r.why+why+(r.tip?"\n\nMemory aid: "+r.tip:"");
      card.appendChild(fb);
      const n=document.createElement("button");n.className="pri";n.style.marginTop="12px";n.textContent="Next question";n.onclick=()=>newQ(false);card.appendChild(n);
      stat();
    };
    card.appendChild(b);
  });
}
function stat(){let a=0,c=0;Object.values(stats).forEach(s=>{a+=s.a;c+=s.c});$("#qstat").textContent=a?`Answered ${a} · ${Math.round(c/a*100)}% correct overall`:"Pick a topic and start practising."}
stat();

// ---- Readiness
function dstat(k){let a=0,c=0;Object.values(stats).forEach(s=>{if(s.d===k){a+=s.a;c+=s.c}});return{a,c}}
function renderProgress(){
  const bars=$("#bars");bars.innerHTML="";
  let tot=0,wsum=0,enough=true;
  Object.entries(D).forEach(([k,v])=>{
    const {a,c}=dstat(k),p=a?c/a:0;
    if(a<5)enough=false;
    tot+=p*v.w;wsum+=v.w;
    const w=document.createElement("div");w.style.marginBottom="12px";
    const t=document.createElement("div");t.textContent=v.name;
    const m=document.createElement("div");m.className="muted";m.textContent=a?`${c}/${a} correct · ${Math.round(p*100)}% · exam weight about ${Math.round(v.w*100)}%`:"No questions yet";
    const bar=document.createElement("div");bar.className="bar";const i=document.createElement("i");i.style.width=Math.round(p*100)+"%";bar.appendChild(i);
    w.append(t,bar,m);bars.appendChild(w);
  });
  const pct=Math.round(tot/wsum*100);
  const any=Object.keys(stats).length>0;
  $("#ready").textContent=any?pct+"%":"–";
  $("#readynote").textContent=!any?"Answer some quiz questions to see your estimate.":!enough?"Answer at least 5 questions in every topic for a reliable estimate.":pct>=80?"Looking strong. Keep practising the weak spots below, then consider booking the exam.":pct>=60?"Getting there. Focus on your weakest subtopics.":"Keep studying. Use the Study Buddy on the topics you miss.";
  const wl=$("#weaklist");wl.innerHTML="";
  const arr=Object.entries(stats).filter(([,s])=>s.a>0).sort((x,y)=>x[1].c/x[1].a-y[1].c/y[1].a).slice(0,5);
  if(!arr.length){wl.textContent="Nothing yet.";wl.className="muted"}
  arr.forEach(([n,s])=>{const p=document.createElement("div");p.style.margin="6px 0";p.textContent=`${Math.round(s.c/s.a*100)}% (${s.c}/${s.a}) · ${n}`;wl.appendChild(p)});
}
$("#reset").onclick=()=>{if(confirm("Clear all saved progress?")){stats={};recent=[];save(stats);renderProgress();stat()}};
</script>
